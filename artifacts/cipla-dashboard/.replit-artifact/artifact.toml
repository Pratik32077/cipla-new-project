kind = "web"
previewPath = "/"
title = "Cipla Healthcare Campaign Dashboard"
version = "1.0.0"
id = "artifacts/cipla-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24444

[services.development]
run = "pnpm --filter @workspace/cipla-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cipla-dashboard", "run", "build" ]
publicDir = "artifacts/cipla-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24444"
BASE_PATH = "/"
